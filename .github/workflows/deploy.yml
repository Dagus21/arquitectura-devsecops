name: Build, Push, and Deploy (Secure VPN + SSH)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout del código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Caché Maven (Backend)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 3. Caché Bun (Frontend)
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      # 4. Configurar nombres Docker
      - name: Generate lower case owner name
        id: strings
        run: echo "owner_lc=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 5. Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Login en GitHub Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # CONSTRUCCIÓN (BUILD)
      # ----------------------------------------------------------------

      # 7. Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-backend:latest

      # 8. E-commerce
      - name: Build and push E-commerce
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-ecommerce
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-ecommerce:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://miscelaneasdavid.shop/api

      # 9. Dashboard
      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-dashboard
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-dashboard:latest
          build-args: |
            API_URL=https://miscelaneasdavid.shop/api

      # ----------------------------------------------------------------
      # DESPLIEGUE (DEPLOY)
      # ----------------------------------------------------------------
      
      # 10. Conectar a VPN (Tailscale) - CRÍTICO: Esto permite llegar a la IP privada
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # 11. Entrar por SSH y Actualizar (Watchtower)
      # Aquí usamos la llave SSH que configuraste en el Paso 3
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}        # Tu IP de Tailscale (100.x.x.x)
          username: ${{ secrets.VPS_USER }}    # Tu usuario (david)
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # Tu llave privada completa
          script: |
            echo "🔐 Autenticando Docker en el VPS..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "🚀 Actualizando contenedores con Watchtower..."
            # Este comando detecta las imágenes nuevas, borra lo viejo y levanta lo nuevo manteniendo la configuración
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              containrrr/watchtower \
              --run-once \
              --cleanup \
              backend-compose dashboard-privado ecommerce-compose
            
            echo "✅ ¡Actualización completada exitosamente!"
          
