name: Build, Push, and Deploy (Clean & Secure)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Caches (Para que compile rápido)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      # 3. Configuración Docker
      - name: Generate lower case owner name
        id: strings
        run: echo "owner_lc=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Construir y Subir Imágenes
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-backend:latest

      - name: Build and push E-commerce
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-ecommerce
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-ecommerce:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://miscelaneasdavid.shop/api

      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-dashboard
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-dashboard:latest
          build-args: |
            API_URL=https://miscelaneasdavid.shop/api

      # ----------------------------------------------------------------
      # FASE DE DESPLIEGUE (ESTRATEGIA HÍBRIDA)
      # ----------------------------------------------------------------
      
      # 5. Conectar a la VPN (Para poder entrar por SSH y llamar a los Webhooks)
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # 6. LIMPIEZA Y ACTUALIZACIÓN DE IMÁGENES (Vía SSH)
      # Esto garantiza que el servidor tenga SÍ o SÍ la última versión antes de reiniciar.
      - name: Force Pull New Images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🔐 1. Autenticando Docker..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "⬇️ 2. Forzando descarga de imágenes nuevas..."
            docker pull ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-backend:latest
            docker pull ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-ecommerce:latest
            docker pull ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-dashboard:latest
            
            echo "🧹 3. Limpiando basura (Imágenes viejas)..."
            docker image prune -f

      # 7. REINICIO DE SERVICIOS (Vía Webhook Seguro)
      # Al llamar al webhook, Dokploy reiniciará los contenedores.
      # Como ya hicimos el 'docker pull' arriba, el reinicio tomará la versión nueva instantáneamente.
      - name: Trigger Dokploy Redeploy
        run: |
          echo "🚀 Reiniciando Backend..."
          curl -k -X POST '${{ secrets.BACKEND_WEBHOOK_URL }}'
          
          echo "🚀 Reiniciando E-commerce..."
          curl -k -X POST '${{ secrets.ECOMMERCE_WEBHOOK_URL }}'
          
          echo "🚀 Reiniciando Dashboard..."
          curl -k -X POST '${{ secrets.DASHBOARD_WEBHOOK_URL }}'
          
          echo "✅ ¡Despliegue limpio completado!"