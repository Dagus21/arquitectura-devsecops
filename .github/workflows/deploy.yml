name: Build and Push to GitHub Container Registry

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- PASO CORREGIDO PARA GENERAR EL NOMBRE EN MINÚSCULAS ---
      - name: Generate lower case owner name
        id: strings # Le damos un ID a este paso para poder referenciarlo
        # Usamos 'tr' que es un comando universal para convertir a minúsculas
        # y lo guardamos como un "output" del paso.
        run: echo "owner_lc=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- USO CORRECTO DE LA VARIABLE ---
      # Ahora referenciamos el "output" del paso con id 'strings'
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-backend:latest

      - name: Build and push E-commerce
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-ecommerce
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-ecommerce:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://miscelaneasdavid.shop/api

      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-dashboard
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-dashboard:latest
          build-args: |
            API_URL=https://miscelaneasdavid.shop/api