name: Build, Push, and Deploy (Secure VPN)

# Se ejecuta solo cuando haces push a la rama 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Permisos necesarios para subir paquetes a GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Descargar el código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cache para Maven (Backend) - Acelera el build
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 3. Cache para Bun (Frontends) - Acelera el build
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      # 4. Preparar nombre de usuario en minúsculas para Docker
      - name: Generate lower case owner name
        id: strings
        run: echo "owner_lc=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 5. Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Iniciar sesión en GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # CONSTRUCCIÓN DE IMÁGENES (BUILD & PUSH)
      # ----------------------------------------------------------------

      # 7. Backend (Spring Boot)
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-backend:latest

      # 8. E-commerce (Next.js)
      - name: Build and push E-commerce
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-ecommerce
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-ecommerce:latest
          # Inyectamos la URL pública de la API para que el cliente la use
          build-args: |
            NEXT_PUBLIC_API_URL=https://miscelaneasdavid.shop/api

      # 9. Dashboard (Angular)
      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-dashboard
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-dashboard:latest
          # Inyectamos la URL pública de la API (aunque el dashboard sea privado, el navegador del cliente necesita salir a internet)
          build-args: |
            API_URL=https://miscelaneasdavid.shop/api

      # ----------------------------------------------------------------
      # CONEXIÓN VPN Y DESPLIEGUE SEGURO
      # ----------------------------------------------------------------
      
      # 10. Conectar GitHub Actions a tu red Tailscale
      # Usa las credenciales OAuth que configuraste
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # 11. Llamar a los Webhooks de Dokploy a través del túnel VPN
      # Como ya actualizaste los secretos con las URLs de Tailscale (https://vmi...ts.net...), esto funcionará directo.
      - name: Trigger Deployments via VPN
        run: |
          curl -k -X POST '${{ secrets.BACKEND_WEBHOOK_URL }}'
          curl -k -X POST '${{ secrets.ECOMMERCE_WEBHOOK_URL }}'
          curl -k -X POST '${{ secrets.DASHBOARD_WEBHOOK_URL }}'
          
