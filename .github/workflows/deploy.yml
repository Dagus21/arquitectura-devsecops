name: Build and Push to GitHub Container Registry

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- CORREGIDO AQUÍ ---
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ghcr.io/${{ toLower(github.repository_owner) }}/tienda-backend:latest

      # --- CORREGIDO AQUÍ ---
      - name: Build and push E-commerce
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-ecommerce
          push: true
          tags: ghcr.io/${{ toLower(github.repository_owner) }}/tienda-ecommerce:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://miscelaneasdavid.shop/api

      # --- CORREGIDO AQUÍ ---
      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-dashboard
          push: true
          tags: ghcr.io/${{ toLower(github.repository_owner) }}/tienda-dashboard:latest
          build-args: |
            API_URL=https://miscelaneasdavid.shop/api