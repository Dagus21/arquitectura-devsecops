name: Build, Push, and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Generate lower case owner name
        id: strings
        run: echo "owner_lc=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-backend:latest

      - name: Build and push E-commerce
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-ecommerce
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-ecommerce:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://miscelaneasdavid.shop/api

      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-dashboard
          push: true
          tags: ghcr.io/${{ steps.strings.outputs.owner_lc }}/tienda-dashboard:latest
          build-args: |
            API_URL=https://miscelaneasdavid.shop/api

      # --- PASOS FINALES DE DESPLIEGUE DIRECTO ---
      - name: Trigger Backend Redeploy
        run: curl -X POST "${{ secrets.DOCKPLOY_WEBHOOK_BACKEND }}"

      - name: Trigger E-commerce Redeploy
        run: curl -X POST "${{ secrets.DOCKPLOY_WEBHOOK_ECOMMERCE }}"

      - name: Trigger Dashboard Redeploy
        run: curl -X POST "${{ secrets.DOCKPLOY_WEBHOOK_DASHBOARD }}"