services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    mem_limit: 1024m
    # Comando para iniciar servidor y consola
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"  # Consola (Privada)
      - "9000:9000"  # API S3 (¡AGREGA ESTE!)
     

volumes:
  minio_data: