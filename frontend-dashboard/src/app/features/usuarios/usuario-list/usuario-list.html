<div class="bg-white p-4 sm:p-6 rounded-2xl shadow-md border border-gray-200">
  <p-table #dt [value]="usuarios" dataKey="id" [paginator]="true" [rows]="10" [loading]="isLoading" 
           class="p-datatable-sm" filterDisplay="row" [filterDelay]="400">
    
    <ng-template pTemplate="caption">
      <div class="flex items-center justify-between pb-2 border-b border-gray-100 mb-2">
        <h2 class="text-xl font-extrabold text-[#000E29]">Gestión de Usuarios</h2>
        <button pButton class="!bg-[#000E29] hover:!bg-[#001B4B] !border-none text-white shadow-md rounded-lg flex items-center shrink-0 px-4 py-2" (click)="openNew()">
          <i class="pi pi-user-plus"></i>
          <span class="hidden sm:inline-block ml-2 font-bold">Nuevo Usuario</span>
        </button>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="nombre">Nombre <p-sortIcon field="nombre"></p-sortIcon></th>
        <th pSortableColumn="email">Correo Electrónico <p-sortIcon field="email"></p-sortIcon></th>
        <th pSortableColumn="telefono">Teléfono <p-sortIcon field="telefono"></p-sortIcon></th>
        <th pSortableColumn="rol" style="width: 15%">Rol <p-sortIcon field="rol"></p-sortIcon></th>
        <th style="width: 10%">Acciones</th>
      </tr>
      
      <tr>
        <th><input pInputText type="text" (input)="dt.filter($any($event.target).value, 'nombre', 'contains')" placeholder="Buscar nombre..." class="w-full text-sm py-1.5 px-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500"></th>
        <th><input pInputText type="text" (input)="dt.filter($any($event.target).value, 'email', 'contains')" placeholder="Buscar correo..." class="w-full text-sm py-1.5 px-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500"></th>
        <th><input pInputText type="text" (input)="dt.filter($any($event.target).value, 'telefono', 'contains')" placeholder="Buscar teléfono..." class="w-full text-sm py-1.5 px-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500"></th>
        <th><p-select [options]="rolesOptions" (onChange)="dt.filter($event.value, 'rol', 'equals')" [showClear]="true" placeholder="Todos" appendTo="body" styleClass="w-full text-sm border-gray-300"></p-select></th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
      <tr>
        <td class="font-bold text-[#000E29]">{{user.nombre}}</td>
        <td class="text-gray-600 font-medium">{{user.email}}</td>
        <td class="text-gray-500">{{user.telefono || 'N/A'}}</td>
        <td><p-tag [value]="user.rol" [severity]="getRolSeverity(user.rol)"></p-tag></td>
        <td>
          <div class="flex gap-1">
            <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text !text-blue-600 hover:!bg-blue-50" pTooltip="Editar" (click)="editUsuario(user)"></button>
            <button pButton icon="pi pi-trash" class="p-button-rounded p-button-text !text-red-500 hover:!bg-red-50" pTooltip="Eliminar" (click)="deleteUsuario(user)" [disabled]="user.rol === 'ADMIN'"></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr><td colspan="5" class="text-center p-6 text-gray-500 font-medium">No se encontraron usuarios registrados.</td></tr>
    </ng-template>
  </p-table>
</div>

<app-usuario-form [visible]="dialogVisible" [usuarioData]="selectedUsuario" [isLoading]="isSaving" (onSave)="saveUsuario($event)" (onCancel)="dialogVisible = false"></app-usuario-form>
