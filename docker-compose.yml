# =================================================================
# == docker-compose.yml - VERSIÓN FINAL MODERNA Y SEGURA (CI/CD)
# =================================================================
# Se ha eliminado la directiva 'version', ya que es obsoleta
# en la especificación moderna de Docker Compose.
# =================================================================

services:
  database:
    image: postgres:15-alpine
    container_name: tienda-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tienda_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tienda-net

  backend:
    image: gustavo763/tienda-backend:latest
    container_name: tienda-backend
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/tienda_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - database
    networks:
      - tienda-net

  frontend-ecommerce:
    image: gustavo763/tienda-ecommerce:latest
    container_name: tienda-ecommerce
    restart: always
    networks:
      - tienda-net

  frontend-dashboard:
    image: gustavo763/tienda-dashboard:latest
    container_name: tienda-dashboard
    restart: always
    networks:
      - tienda-net

  proxy:
    image: caddy:2-alpine
    container_name: tienda-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tienda-net

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  tienda-net:
    driver: bridge
