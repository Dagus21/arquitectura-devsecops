# docker-compose.yml - VERSIÓN FINAL Y DEPURADA

version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: tienda-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bdpostgress123
      POSTGRES_DB: tienda_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tienda-net

  backend:
    build:
      context: ./Backend
    image: mi-tienda/backend  # <-- Nombre explícito
    container_name: tienda-backend
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/tienda_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=bdpostgress123
    depends_on:
      - database
    networks:
      - tienda-net

  frontend-ecommerce:
    build:
      context: ./frontend-ecommerce
      args:
        - NEXT_PUBLIC_API_URL=http://72.60.170.134/api
    image: mi-tienda/ecommerce # <-- Nombre explícito
    container_name: tienda-ecommerce
    restart: always
    networks:
      - tienda-net

  frontend-dashboard:
    build:
      context: ./frontend-dashboard
    image: mi-tienda/dashboard # <-- Nombre explícito
    container_name: tienda-dashboard
    restart: always
    networks:
      - tienda-net

  proxy:
    image: caddy:2-alpine
    container_name: tienda-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tienda-net

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  tienda-net:
    driver: bridge
