# ========================================================================
#              CONFIGURACION DE LA BASE DE DATOS POSTGRESQL
# ========================================================================

# Propósito: Le indica a Hibernate (el motor de persistencia de Spring Data JPA) qué "dialecto" de SQL debe hablar.
# Por qué es necesario: Cada sistema de base de datos (PostgreSQL, MySQL, Oracle, etc.) tiene ligeras diferencias en su sintaxis SQL.
# Al especificar "org.hibernate.dialect.PostgreSQLDialect", te aseguras de que todas las consultas SQL generadas por
# tu aplicación sean 100% compatibles y optimizadas para PostgreSQL.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Propósito: Controla cómo Hibernate interactúa con el esquema de la base de datos al arrancar.
# El valor "validate" es una medida de seguridad crucial. Le dice a Hibernate: "No crees ni modifiques ninguna tabla.
# Simplemente comprueba que las tablas y columnas de la base de datos coincidan exactamente con mis clases @Entity en Java.
# Si algo no coincide, detén el arranque de la aplicación y lanza un error".
# Esto previene problemas causados por una base de datos desactualizada y cede el control total de la gestión del esquema a Liquibase.
spring.jpa.hibernate.ddl-auto=validate

# ========================================================================
#                       CONFIGURACION DE LIQUIBASE
# ========================================================================

# Propósito: Le indica a Spring Boot dónde encontrar el archivo principal de configuración de Liquibase.
# Por qué es necesario: Liquibase gestiona la evolución del esquema de tu base de datos de forma controlada y versionada.
# Este archivo "db.changelog-master.xml" es el punto de entrada que orquesta todos los scripts de migración (como tu
# "001-crear-tablas-iniciales.sql"). Esto asegura que la base de datos se configure de manera consistente en cualquier entorno.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ========================================================================
#                   CONFIGURACION DE SPRINGDOC (SWAGGER)
# ========================================================================

# Propósito: Define la ruta exacta donde se expondrá la especificación OpenAPI v3 de tu API.
# Este es el "cerebro" de tu documentación, un archivo JSON gigante que describe cada endpoint, sus parámetros, respuestas, etc.
# Por qué es CRÍTICO: La interfaz gráfica de Swagger UI (la página web) necesita llamar a esta URL para obtener los datos
# y poder renderizar la documentación interactiva. Sin esta línea, la UI no sabría dónde encontrar la descripción de la API.
springdoc.api-docs.path=/api/api-docs
# Le decimos a Spring: "Busca la variable SWAGGER_ENABLED".
# ":true" significa: "Si no encuentras la variable (como en local), déjalo encendido".
springdoc.api-docs.enabled=${SWAGGER_ENABLED}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED}

# ========================================================================
#          CONFIGURACION DE MINIO (STORAGE) - ¡ESTO FALTABA!
# ========================================================================
# Sin esto, tu StorageService.java dará error al arrancar.
# URL PÚBLICA (Para generar links): https://s3.miscelaneasdavid.shop
minio.public.url=${MINIO_PUBLIC_URL}
# URL INTERNA (Para conectar el Backend): http://100.x.y.z:9000
minio.internal.url=${MINIO_INTERNAL_URL}
minio.access.key=${MINIO_ACCESS_KEY}
minio.secret.key=${MINIO_SECRET_KEY}
minio.bucket.name=${MINIO_BUCKET_NAME}
# ========================================================================
#                   SUBIDA DE ARCHIVOS (MULTIPART)
# ========================================================================
# Límite por archivo individual (ej: una sola foto)
spring.servlet.multipart.max-file-size=10MB
# Límite total de la petición (ej: si subieras 5 fotos a la vez)
spring.servlet.multipart.max-request-size=10MB

# Propósito: Define explícitamente la ruta completa para acceder al archivo HTML principal de la interfaz de Swagger UI.
# Por qué es NECESARIO: Aunque 'server.forward-headers-strategy' ayuda a la aplicación a entender el contexto del proxy,
# esta directiva elimina cualquier ambigüedad para la propia librería SpringDoc. Asegura que toda la lógica interna de SpringDoc
# (como redirecciones) se construya sobre la ruta base correcta. Actúa como una instrucción directa que prevalece sobre el comportamiento por defecto.
springdoc.swagger-ui.path=/api/swagger-ui.html

# ========================================================================
#                   ESTRATEGIA DE PROXY INVERSO
# ========================================================================

# Propósito: Le indica al servidor web embebido de Spring Boot (Tomcat) que debe confiar y procesar las cabeceras HTTP que son añadidas por un proxy inverso.
# Por qué es ESENCIAL: Cuando un usuario accede a tu IP, la petición primero llega a Caddy (el proxy). Caddy luego reenvía la petición
# a tu aplicación Spring Boot, añadiendo cabeceras como 'X-Forwarded-Host' y 'X-Forwarded-Proto'.
# El valor "framework" le dice a Spring que utilice estas cabeceras para construir las URLs. Sin esto, Swagger generaría URLs
# apuntando a "http://localhost:8080/..." en lugar de "http://<tu-ip>/...", lo cual rompería la funcionalidad.
server.forward-headers-strategy=framework

